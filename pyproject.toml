[project]
name = "portfolio"
version = "1.0.0"
description = "Portfolio de Trules Doniphane — Concepteur Développeur d'Applications"
requires-python = ">=3.11"

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["A003"]  # les attributs HTML demandés par Jinja s'appellent `items`, `class`…

[tool.ruff.lint.per-file-ignores]
# Les chemins SVG d'icônes et le contenu éditorial sont des longues lignes assumées.
"app/data/icons.py" = ["E501"]
"app/templates/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
